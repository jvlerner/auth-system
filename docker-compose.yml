services:
  # ---------------------------------------------------------
  # API GATEWAY (Nginx)
  # Roteamento Inteligente (Read vs Write) e Ponto Único
  # ---------------------------------------------------------
  api-gateway:
    image: nginx:alpine
    container_name: auth_api_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/certs:/etc/nginx/ssl:ro
    depends_on:
      - api-write
      - api-read

  # ---------------------------------------------------------
  # BANCOS DE DADOS DURÁVEIS (CQRS - Master/Replica)
  # ---------------------------------------------------------
  postgres-write:
    image: postgres:16.13-trixie
    container_name: auth_postgres_write
    env_file:
      - configs/envs/.env.pg-write
    ports:
      - "5432:5432"
    volumes:
      - pgdata_write:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-read:
    image: postgres:16.13-trixie
    container_name: auth_postgres_read
    depends_on:
      postgres-write:
        condition: service_healthy
    env_file:
      - configs/envs/.env.pg-read
    ports:
      - "5433:5432" # Porta externa 5433
    volumes:
      - pgdata_read:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # CACHE EM MEMÓRIA (Sessões/Tokens/Otimizações HTTP)
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: auth_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # MESSAGE BROKER (Event-Driven / CQRS)
  # ---------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: auth_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # Porta do protocolo AMQP
      - "15672:15672" # Painel de gerenciamento Web
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # MIGRATIONS (Efêmero - Roda e morre)
  # ---------------------------------------------------------
  migrate-write:
    image: migrate/migrate:v4.15.2
    container_name: auth_db_migrate_write
    volumes:
      - ./migrations/write:/migrations
    command:
      - -path=/migrations
      - -database=postgres://auth_user:auth_password@postgres-write:5432/auth_db?sslmode=disable
      - up
    depends_on:
      postgres-write:
        condition: service_healthy

  # ---------------------------------------------------------
  # MICROSERVICES (Aplicações Go)
  # ---------------------------------------------------------
  api-write:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: auth_api_write
    command: air -c .air.toml
    env_file:
      - configs/envs/.env.api-write
    volumes:
      - .:/app
      - ./configs/certs:/etc/ssl/certs:ro
    depends_on:
      postgres-write:
        condition: service_healthy

  api-read:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: auth_api_read
    command: air -c .air.toml
    env_file:
      - configs/envs/.env.api-read
    volumes:
      - .:/app
      - ./configs/certs:/etc/ssl/certs:ro
    depends_on:
      postgres-read:
        condition: service_healthy

  worker-events:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: auth_worker_events
    command: air -c .air.toml
    env_file:
      - configs/envs/.env.worker
    volumes:
      - .:/app
      - ./configs/certs:/etc/ssl/certs:ro
    depends_on:
      postgres-write:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------
  # gRPC SERVICES (CPU Bound / Isoladas)
  # ---------------------------------------------------------
  grpc-password:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_grpc_password
    command: ["air", "-c", ".air.toml"] # Temporário dev, na real deveria compilar o cmd/grpc-password
    env_file:
      - configs/envs/.env.grpc-password
    ports:
      - "50051:50051"
    volumes:
      - .:/app
      - ./configs/certs:/etc/ssl/certs:ro

  grpc-token:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_grpc_token
    command: ["air", "-c", ".air.toml"] 
    env_file:
      - configs/envs/.env.grpc-token
    ports:
      - "50052:50052"
    volumes:
      - .:/app
      - ./configs/certs:/etc/ssl/certs:ro
    depends_on:
      - postgres-write

volumes:
  pgdata_write:
  pgdata_read:
  redisdata:
  rabbitmqdata:
